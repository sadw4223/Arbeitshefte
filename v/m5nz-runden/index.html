<script id="data" type="application/json">{"steps": ["Runden heißt: Du suchst eine Zahl in der Nähe, mit der man leichter rechnen kann.", "Schaue dir die 47 am Zahlenstrahl an. Sie liegt zwischen 40 und 50.", "40 und 50 sind die Nachbarzehner von 47.", "Von 47 bis 50 sind es 3 Schritte.", "Von 47 bis 40 sind es 7 Schritte.", "47 liegt näher an 50. Auf Zehner gerundet wird 47 zu 50.", "Es geht auch ohne Zahlenstrahl. Die Rundungsstelle ist mit einem Punkt markiert. Auf Zehner runden: Das ist die Zehnerstelle.", "Schaue auf die Ziffer rechts daneben. Bei 47 ist das die 7.", "0, 1, 2, 3, 4: Du rundest ab. 5, 6, 7, 8, 9: Du rundest auf.", "Die 7 heißt: aufrunden. Aus 4 Zehnern werden 5 Zehner, die Einer werden 0. 47 wird zu 50.", "Noch ein Beispiel: 43.", "Rechts neben dem Punkt steht eine 3. Also rundest du ab.", "Die 4 bleibt, die 3 wird 0. 43 wird zu 40.", "Und 45? Rechts neben dem Punkt steht eine 5. Bei 5 rundest du auf.", "45 wird zu 50.", "Große Zahlen rundest du genauso. Bei 1 362 steht der Punkt unter der Zehnerstelle, der 6.", "Rechts daneben steht eine 2. Also rundest du ab.", "1 362 wird zu 1 360.", "Übe jetzt im Heft oder mit der Übung am Tablet."], "labels": {"next": "Weiter", "back": "Zurück", "again": "Noch einmal", "icNext": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M4 15V9h8V4.16L19.84 12 12 19.84V15z\"/><\/svg><\/span>", "icBack": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M20 9v6h-8v4.84L4.16 12 12 4.16V9z\"/><\/svg><\/span>", "icAgain": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 0 0-8 8 8 8 0 0 0 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18a6 6 0 0 1-6-6 6 6 0 0 1 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z\"/><\/svg><\/span>"}}</sc
