<script id="data" type="application/json">{"steps": [{"a": "../../audio/Mathematik5_Runden_Video/01.mp3", "t": "Hallo! In diesem Video lernst du, wie man Zahlen auf Zehner rundet. Runden heißt: Du suchst eine Zahl in der Nähe, mit der man leichter rechnen kann."}, {"a": "../../audio/Mathematik5_Runden_Video/02.mp3", "t": "Schau dir die Zahl 47 an. Auf dem Zahlenstrahl liegt 47 zwischen 40 und 50. 40 und 50 sind die Nachbarzehner von 47."}, {"a": "../../audio/Mathematik5_Runden_Video/03.mp3", "t": "Von 47 bis 50 sind es nur 3 Schritte. Bis 40 sind es 7 Schritte. 47 liegt also näher an 50. Auf Zehner gerundet wird 47 zu 50."}, {"a": "../../audio/Mathematik5_Runden_Video/04.mp3", "t": "Das geht auch ohne Zahlenstrahl. Die Rundungsstelle ist mit einem Punkt markiert. Beim Runden auf Zehner ist das die Zehnerstelle. Bei 47 ist das die 4."}, {"a": "../../audio/Mathematik5_Runden_Video/05.mp3", "t": "Jetzt schaust du auf die Ziffer rechts daneben. Bei 47 ist das die 7."}, {"a": "../../audio/Mathematik5_Runden_Video/06.mp3", "t": "Ist diese Ziffer eine 0, 1, 2, 3 oder 4, dann rundest du ab. Ist sie eine 5, 6, 7, 8 oder 9, dann rundest du auf."}, {"a": "../../audio/Mathematik5_Runden_Video/07.mp3", "t": "Die 7 heißt also: aufrunden. Aus 4 Zehnern werden 5 Zehner. Die Ziffer danach wird 0. So wird aus 47 die 50."}, {"a": "../../audio/Mathematik5_Runden_Video/08.mp3", "t": "Noch ein Beispiel: 43. Rechts neben dem Punkt steht eine 3. Also rundest du ab. Die 4 bleibt, die 3 wird 0. 43 wird zu 40."}, {"a": "../../audio/Mathematik5_Runden_Video/09.mp3", "t": "Und was ist mit 45? Rechts neben dem Punkt steht eine 5. Bei 5 rundest du auf. 45 wird zu 50."}, {"a": "../../audio/Mathematik5_Runden_Video/10.mp3", "t": "Bei großen Zahlen geht es genauso. Schau dir 1362 an. Der Punkt steht unter der Zehnerstelle, der 6. Rechts daneben steht eine 2. Also rundest du ab. 1362 wird zu 1360."}, {"a": "../../audio/Mathematik5_Runden_Video/11.mp3", "t": "Jetzt bist du dran! Übe im Heft oder mit der Übung am Tablet. Viel Spaß!"}], "labels": {"play": "Abspielen", "pause": "Pause", "again": "Noch einmal ansehen", "back": "Zurück", "rep": "Nochmal", "slow": "Langsamer", "soon": "Der Ton kommt bald.", "icPlay": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M8 5.14v14l11-7z\"/><\/svg><\/span>", "icPause": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M14 19h4V5h-4M6 19h4V5H6z\"/><\/svg><\/span>", "icBack": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M6 18V6h2v12zm3.5-6L18 6v12z\"/><\/svg><\/span>", "icRep": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M12 5V1L7 6l5 5V7a6 6 0 0 1 6 6 6 6 0 0 1-6 6 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 8-8 8 8 0 0 0-8-8\"/><\/svg><\/span>", "icSlow": "<span class=\"ic\" aria-hidden=\"true\"><svg focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><path d=\"M8.47 5.95c.48-.28 1-.51 1.53-.67V4c0-1.1.87-2 1.97-2.03C13.13 2 14 2.9 14 4v1.28c.53.17 1.05.39 1.53.67l-1.6 2.12h-3.86zM19 12c0 .5-.05.95-.14 1.4l-2.53-.78-1.19-3.66 1.6-2.11q.645.6 1.14 1.35c.79-.07 1.55.05 2.23.39 1.03.53 1.73 1.54 1.89 2.69l-3 .36zM5 12v-.35l-3-.37c.16-1.15.86-2.16 1.89-2.69a3.54 3.54 0 0 1 2.19-.33c.33-.51.71-.98 1.16-1.39l1.62 2.08-1.19 3.67-2.53.78C5.05 12.95 5 12.5 5 12m5.24-2.43h3.52l1.09 3.36L12 15l-2.85-2.07zm-2.11 4.48 3.12 2.26v2.65c-.57-.06-1.12-.19-1.63-.38l-1.23 2.76a3.49 3.49 0 0 1-2.02-2.58c-.14-.76-.02-1.52.32-2.2-.45-.52-.82-1.1-1.1-1.74zm7.74 0 2.54.77c-.28.64-.65 1.22-1.1 1.74.34.68.46 1.44.33 2.2a3.52 3.52 0 0 1-2.03 2.58l-1.22-2.76c-.53.19-1.06.36-1.64.42v-2.69z\"/><\/svg><\/span>"}}</script>
